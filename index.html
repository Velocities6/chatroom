<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Friendroom</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login">
        <h1>FRIENDROOM</h1>

        <p>Private friend chat</p>

        <input
            id="email"
            type="email"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button id="loginButton">
            ENTER
        </button>

        <p id="error"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

</body>
</html>
